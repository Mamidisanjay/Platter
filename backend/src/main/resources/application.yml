spring:
  application:
    name: platter-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/platter}
    username: ${DATABASE_USERNAME:platter}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  cache:
    type: redis
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
platter:
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  scheduler:
    promo-expiry: ${PLATTER_SCHEDULER_PROMO_EXPIRY:0 */15 * * * *}
  rate-limit:
    capacity: ${PLATTER_RATE_LIMIT_CAPACITY:60}
    window-seconds: ${PLATTER_RATE_LIMIT_WINDOW_SECONDS:60}
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: ${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com}
    timeout-seconds: ${GOOGLE_MAPS_TIMEOUT_SECONDS:5}
